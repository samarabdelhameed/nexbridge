[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
verbosity = 3

[fmt]
line_length = 100

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
abstract_testnet = "${ABSTRACT_TESTNET_RPC_URL}"
anvil_l1 = "http://127.0.0.1:8545"
anvil_l2 = "http://127.0.0.1:8546"
